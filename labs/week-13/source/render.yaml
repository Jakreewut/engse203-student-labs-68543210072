# render.yaml — Render Blueprint
services:
  - type: web
    name: campus-service
    runtime: node
    plan: free
    region: singapore
    rootDir: labs/week-13/source
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # ⭐ Challenge: ให้ Render สุ่มค่า JWT_SECRET อัตโนมัติ
      - key: JWT_SECRET
        generateValue: true
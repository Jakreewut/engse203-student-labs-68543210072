name: LAB Check
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd api && npm install && npm run db:setup
      - run: node --disable-warning=ExperimentalWarning check-week11.mjs